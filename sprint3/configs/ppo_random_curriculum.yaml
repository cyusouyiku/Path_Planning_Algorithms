# PPO 随机地图池课程：与 benchmark preset 同分布（无走廊、min_path_stretch）
# 每阶段预生成地图池，reset 时随机换图；留出种子与训练池不重叠

holdout_base_seed: 9000000
holdout_seed_stride: 49999

stages:
  - name: random_96
    rows: 96
    cols: 96
    safe_radius: 3
    map_pool_size: 20
    pool_base_seed: 11000
    holdout_maps: 10
    ship_pipe:
      num_blocks: [4, 8]
      block_size_frac: [0.08, 0.20]
      corridor_half_width: 0
      min_path_stretch: 1.12
      hull_depth: 2
      hull_fill_prob: 0.78
      max_build_trials: 160
    timesteps: 80000
    max_episode_steps: 280
    eval_every: 40000
    eval_episodes_per_map: 2
    window: 21

  - name: random_192
    rows: 192
    cols: 192
    safe_radius: 3
    map_pool_size: 18
    pool_base_seed: 21000
    holdout_maps: 8
    ship_pipe:
      num_blocks: [6, 11]
      block_size_frac: [0.07, 0.18]
      corridor_half_width: 0
      min_path_stretch: 1.12
      hull_depth: 2
      hull_fill_prob: 0.80
      max_build_trials: 180
    timesteps: 100000
    max_episode_steps: 520
    eval_every: 50000
    eval_episodes_per_map: 2
    window: 21

  - name: random_384
    rows: 384
    cols: 384
    safe_radius: 4
    map_pool_size: 14
    pool_base_seed: 31000
    holdout_maps: 6
    ship_pipe:
      num_blocks: [10, 16]
      block_size_frac: [0.06, 0.17]
      corridor_half_width: 0
      min_path_stretch: 1.12
      hull_depth: 3
      hull_fill_prob: 0.82
      max_build_trials: 200
    timesteps: 120000
    max_episode_steps: 1100
    eval_every: 60000
    eval_episodes_per_map: 2
    window: 21

  - name: random_500
    rows: 500
    cols: 500
    safe_radius: 4
    map_pool_size: 12
    pool_base_seed: 41000
    holdout_maps: 6
    ship_pipe:
      num_blocks: [12, 20]
      block_size_frac: [0.06, 0.18]
      corridor_half_width: 0
      min_path_stretch: 1.12
      hull_depth: 3
      hull_fill_prob: 0.82
      perimeter_shell: 2
      wall_thickness_prob: 0.58
      max_build_trials: 220
    timesteps: 200000
    max_episode_steps: 2800
    eval_every: 100000
    eval_episodes_per_map: 2
    window: 21
