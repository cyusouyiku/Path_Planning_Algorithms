# 快速验证版课程（总步数约 15 万，用于先出报告）
stages:
  - name: free_64
    rows: 64
    cols: 64
    obstacles: false
    timesteps: 20000
    max_episode_steps: 150
    window: 21

  - name: sparse_128
    rows: 128
    cols: 128
    layout: ship_pipe
    obstacles: true
    ship_pipe:
      num_blocks: [3, 5]
      corridor_half_width: 6
      hull_depth: 2
    timesteps: 30000
    max_episode_steps: 300
    window: 21

  - name: medium_256
    rows: 256
    cols: 256
    layout: ship_pipe
    obstacles: true
    ship_pipe:
      num_blocks: [5, 9]
      corridor_half_width: 10
      hull_depth: 2
    timesteps: 40000
    max_episode_steps: 600
    window: 21

  - name: target_500
    preset: ship_pipe_500
    timesteps: 60000
    max_episode_steps: 1500
    window: 21

  - name: target_1000
    preset: ship_pipe_1000
    timesteps: 80000
    max_episode_steps: 3000
    window: 21
